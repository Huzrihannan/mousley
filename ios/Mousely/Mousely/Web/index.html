<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mousely Media Remote</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="liquid-glass/glass.css">
</head>
<body>
  <!-- Ambient background lighting for realistic glass refraction -->
  <div class="ambient-mesh">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="app-viewport">
    <!-- Top Header Bar -->
    <header class="top-bar">
      <div class="status-badge" id="statusBadge" onclick="openDeviceModal()">
        <span class="status-dot" id="statusDot"></span>
        <span class="device-name" id="statusDeviceName">Searching for PC...</span>
        <span class="latency-tag" id="latencyTag">-- ms</span>
      </div>
      <button class="header-action-btn" id="btnSettings" onclick="openDeviceModal()" title="Select PC / Connection">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <!-- Main Player Card -->
    <main class="player-card" id="playerCard">
      <!-- Album Art Container -->
      <div class="artwork-container" id="artworkContainer">
        <img class="artwork-img" id="albumArtImg" src="assets/default-art.svg" alt="Album Artwork" onerror="this.src='assets/default-art.svg'">
        <div class="source-app-pill" id="sourceAppPill">Windows Media</div>
      </div>

      <!-- Track Information -->
      <div class="track-info">
        <div class="track-title" id="trackTitle">Ready to Connect</div>
        <div class="track-artist" id="trackArtist">Waiting for Windows Playback</div>
      </div>

      <!-- Timeline & Scrubber -->
      <div class="timeline-section" id="timelineSection">
        <div class="timeline-bar-wrap" id="timelineBar">
          <div class="timeline-progress" id="timelineProgress">
            <div class="timeline-thumb"></div>
          </div>
        </div>
        <div class="timeline-timestamps">
          <span id="timeElapsed">0:00</span>
          <span id="timeTotal">0:00</span>
        </div>
      </div>

      <!-- Playback Controls Cluster -->
      <div class="controls-cluster">
        <!-- Previous Track Button -->
        <button class="btn-ctrl btn-skip" id="btnPrev" title="Previous Track">
          <svg viewBox="0 0 24 24">
            <polygon points="19 20 9 12 19 4 19 20"></polygon>
            <line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"></line>
          </svg>
        </button>

        <!-- Play / Pause Centerpiece Button -->
        <button class="btn-ctrl btn-play" id="btnPlayPause" title="Play / Pause">
          <svg id="playIcon" viewBox="0 0 24 24">
            <polygon points="6 4 20 12 6 20 6 4"></polygon>
          </svg>
          <svg id="pauseIcon" viewBox="0 0 24 24" style="display: none;">
            <rect x="6" y="4" width="4" height="16" rx="1.5"></rect>
            <rect x="14" y="4" width="4" height="16" rx="1.5"></rect>
          </svg>
        </button>

        <!-- Next Track Button -->
        <button class="btn-ctrl btn-skip" id="btnNext" title="Next Track">
          <svg viewBox="0 0 24 24">
            <polygon points="5 4 15 12 5 20 5 4"></polygon>
            <line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"></line>
          </svg>
        </button>
      </div>
    </main>

    <!-- Volume Synchronization Card -->
    <section class="volume-card">
      <div class="volume-header">
        <div class="volume-label-group">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <span>Volume</span>
        </div>
        <div class="volume-val-badge" id="volumeBadge">50%</div>
      </div>

      <!-- Live Volume Slider -->
      <div class="volume-slider-row">
        <button class="volume-icon-btn" id="btnMuteToggle" title="Mute / Unmute">
          <svg id="volIcon" viewBox="0 0 24 24">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07" stroke="currentColor" stroke-width="2" fill="none"></path>
          </svg>
          <svg id="muteIcon" viewBox="0 0 24 24" style="display: none;">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
            <line x1="17" y1="9" x2="23" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
          </svg>
        </button>

        <div class="volume-track-wrap" id="volumeTrack">
          <div class="volume-fill" id="volumeFill">
            <div class="volume-thumb"></div>
          </div>
        </div>

        <button class="volume-icon-btn" id="btnVolMax" title="Max Volume">
          <svg viewBox="0 0 24 24">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07" stroke="currentColor" stroke-width="2" fill="none"></path>
          </svg>
        </button>
      </div>

      <!-- Quick Jump Presets -->
      <div class="preset-buttons-row">
        <button class="preset-pill" onclick="setVolumePreset(25)">25%</button>
        <button class="preset-pill" onclick="setVolumePreset(50)">50%</button>
        <button class="preset-pill" onclick="setVolumePreset(75)">75%</button>
        <button class="preset-pill" onclick="setVolumePreset(100)">100%</button>
        <button class="preset-pill" onclick="toggleMute()">Mute</button>
      </div>
    </section>
  </div>

  <!-- Device Discovery & Connection Modal -->
  <div class="modal-overlay" id="deviceModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3 class="modal-title">Connect to Windows PC</h3>
        <button class="modal-close-btn" onclick="closeDeviceModal()">✕</button>
      </div>

      <div class="device-list" id="discoveredList">
        <!-- Discovered devices populated dynamically -->
        <div class="device-item" style="color: var(--text-secondary); justify-content: center;">
          Scanning local Wi-Fi for Mousely...
        </div>
      </div>

      <div class="manual-connect-form">
        <h4>Manual IP Connection</h4>
        <div class="input-row">
          <input type="text" class="ip-input" id="manualIpInput" placeholder="192.168.1.xxx:8089">
          <button class="btn-primary" onclick="connectManual()">Connect</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="liquid-glass/html2canvas.min.js"></script>
  <script src="liquid-glass/container.js"></script>
  <script src="liquid-glass/button.js"></script>
  <script src="app.js"></script>
</body>
</html>
