<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mousely - Windows Remote Deck</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- ================= ZERO-OVERHEAD CONTINUOUS FLUID BACKGROUND ================= -->
  <div class="fluid-background-root" aria-hidden="true">
    <div class="fluid-layer-ambient"></div>
    <div class="fluid-layer-flow1"></div>
    <div class="fluid-layer-flow2"></div>
    <div class="fluid-layer-vignette"></div>
  </div>

  <!-- Dynamic Island Notification Toast -->
  <div class="apple-island-toast" id="appleToast">
    <div class="island-icon" id="toastIcon">✨</div>
    <span class="island-text" id="toastText">Connected</span>
  </div>

  <!-- Master App Container -->
  <div class="app-landscape-root">
    
    <!-- Top Liquid Glass Navigation Header -->
    <header class="top-glass-header" id="topGlassHeader">
      <!-- Master Mode Toggle Pill (Remote vs Controller) -->
      <div class="master-mode-pill" id="masterModePill">
        <button class="mode-pill-tab active" id="pillModeRemote" onclick="setMasterMode('remote')" title="Remote Control Mode">
          <span class="mode-dot dot-red"></span>
          <span>Remote</span>
        </button>
        <button class="mode-pill-tab" id="pillModeGame" onclick="setMasterMode('game')" title="Gaming Controller Mode">
          <span class="mode-dot dot-green"></span>
          <span>Controller</span>
        </button>
      </div>

      <!-- Center: Liquid Glass Segmented Page Switcher -->
      <nav class="nav-segmented-glass" id="navTabs">
        <!-- Remote Mode Pages (Trackpad, Media, Apps, Actions) -->
        <div class="header-tabs-group" id="remoteTabsGroup">
          <button class="nav-glass-tab active" data-page="0" onclick="switchPage(0)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="18" rx="4"></rect>
              <line x1="2" y1="15" x2="22" y2="15"></line>
              <line x1="12" y1="15" x2="12" y2="21"></line>
            </svg>
            <span>Trackpad</span>
          </button>
          <button class="nav-glass-tab" data-page="1" onclick="switchPage(1)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 18V5l12-2v13"></path>
              <circle cx="6" cy="18" r="3"></circle>
              <circle cx="18" cy="16" r="3"></circle>
            </svg>
            <span>Media</span>
          </button>
          <button class="nav-glass-tab" data-page="2" onclick="switchPage(2)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            <span>Apps</span>
          </button>
          <button class="nav-glass-tab" data-page="3" onclick="switchPage(3)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
              <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
            </svg>
            <span>Actions</span>
          </button>
        </div>

        <!-- Controller Sub-Mode Tabs (Gamepad ↔ Gyro Steering) -->
        <div class="header-tabs-group hidden" id="gameTabsGroup">
          <button class="nav-glass-tab controller-sub-tab" id="subTabGamepad" onclick="setControllerSubMode('gamepad')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <rect x="2" y="6" width="20" height="12" rx="4"></rect>
              <line x1="6" y1="12" x2="10" y2="12"></line>
              <line x1="8" y1="10" x2="8" y2="14"></line>
              <circle cx="15" cy="12" r="1"></circle>
              <circle cx="18" cy="10" r="1"></circle>
            </svg>
            <span>Gamepad</span>
          </button>
          <button class="nav-glass-tab active controller-sub-tab" id="subTabGyro" onclick="setControllerSubMode('gyro')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M12 3v18"></path>
              <path d="M3 12h18"></path>
            </svg>
            <span>🏎️ Gyro Steering</span>
          </button>
        </div>
      </nav>

      <!-- Right: Telemetry Chip & Settings / Scan Button -->
      <div class="header-right-group">
        <div class="telemetry-badge-chip hidden" id="telemetryBadgeChip">
          <span class="chip-pulse-dot"></span>
          <span class="chip-label">0.8ms UDP • 60 FPS • LINKED</span>
          <span class="chip-signal-icon">📶</span>
        </div>
        <button class="header-glass-icon-btn" onclick="showDesktopSelector()" title="Scan Devices">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="21" x2="4" y2="14"></line>
            <line x1="4" y1="10" x2="4" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12" y2="3"></line>
            <line x1="20" y1="21" x2="20" y2="16"></line>
            <line x1="20" y1="12" x2="20" y2="3"></line>
            <line x1="1" y1="14" x2="7" y2="14"></line>
            <line x1="9" y1="8" x2="15" y2="8"></line>
            <line x1="17" y1="16" x2="23" y2="16"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Viewport Carousel (4 Pages) -->
    <div class="carousel-viewport" id="carouselViewport">
      <div class="carousel-slider-track" id="carouselTrack">
        
        <!-- =========================================================================
             PAGE 0: APPLE MAGIC TRACKPAD (Maximized Frosted Glass + Dot Grid Matrix)
             ========================================================================= -->
        <section class="carousel-page-pane page-trackpad" id="pageTrackpad">
          <div class="liquid-trackpad-card">
            <div class="trackpad-glass-specular"></div>

            <!-- Glass Trackpad Active Touch Surface with Dot Matrix Texture -->
            <div class="trackpad-touch-surface" id="trackpadTouchSurface">
              <div class="trackpad-center-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M12 4v16M4 12h16"></path>
                </svg>
                <span>Magic Glass Trackpad</span>
              </div>
              <div class="trackpad-reticle" id="trackpadReticle"></div>

              <!-- Integrated Bottom Click Regions (Divided by subtle hairline) -->
              <div class="trackpad-bottom-regions" id="trackpadBottomRegions">
                <div class="trackpad-region region-left" id="regionLeftClick">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="15 18 9 12 15 6"></polyline>
                  </svg>
                  <span class="region-title">Left Click</span>
                  <span class="region-sub">Primary</span>
                </div>
                <div class="trackpad-region-divider"></div>
                <div class="trackpad-region region-right" id="regionRightClick">
                  <span class="region-title">Right Click</span>
                  <span class="region-sub">Secondary</span>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="9 18 15 12 9 6"></polyline>
                  </svg>
                </div>
              </div>
            </div>

          </div>
        </section>

        <!-- =========================================================================
             PAGE 1: MEDIA CONTROL (Center Player + Waveform + Ruby Capsule + Volume)
             ========================================================================= -->
        <section class="carousel-page-pane page-media" id="pageMedia">
          <div class="liquid-media-deck-card">
            <div class="glass-specular-highlight"></div>

            <!-- Left Deck: Artwork + Live Track Info + Quality Badge -->
            <div class="media-deck-left">
              <div class="media-art-frame" id="artworkContainer">
                <img id="albumArtImg" class="media-art-img" src="assets/default-art.svg" alt="Album Art" onerror="this.src='assets/default-art.svg'">
                <div class="art-specular-gloss"></div>
              </div>

              <div class="media-meta-group">
                <div class="now-playing-pill">
                  <span class="live-wave-icon">
                    <span class="wave-stem stem-1"></span>
                    <span class="wave-stem stem-2"></span>
                    <span class="wave-stem stem-3"></span>
                    <span class="wave-stem stem-4"></span>
                  </span>
                  <span>Now Playing</span>
                </div>

                <h1 class="media-track-title" id="trackTitle">Reborn</h1>
                <div class="media-track-artist" id="trackArtist">Koven</div>

                <div class="media-badge-row">
                  <div class="media-quality-badge">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/>
                    </svg>
                    <span>Lossless</span>
                  </div>

                  <button class="media-favorite-btn" id="btnHeart" onclick="toggleFavorite()" title="Like Track">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                    </svg>
                  </button>
                </div>
              </div>
            </div>

            <!-- Right Deck: Scrubber + Big Ruby Capsule Play/Pause + Volume Rail -->
            <div class="media-deck-right">
              
              <!-- Fast Waveform Audio Scrubber -->
              <div class="media-waveform-block">
                <div class="waveform-scrubber-wrap" id="waveformBar">
                  <div class="waveform-bars-track" id="waveformBarsBase"></div>
                  <div class="waveform-progress-clip" id="waveformProgressClip">
                    <div class="waveform-bars-track active" id="waveformBarsActive"></div>
                  </div>
                  <div class="waveform-needle" id="waveformNeedle">
                    <div class="needle-bead"></div>
                  </div>
                </div>
                <div class="waveform-time-row">
                  <span class="time-readout" id="timeElapsed">1:37</span>
                  <span class="time-readout" id="timeTotal">4:32</span>
                </div>
              </div>

              <!-- Transport Controls Row -->
              <div class="media-controls-row">
                <button class="btn-transport" id="btnShuffle" onclick="toggleShuffle()" title="Shuffle">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="16 3 21 3 21 8"></polyline>
                    <line x1="4" y1="20" x2="21" y2="3"></line>
                    <polyline points="21 16 21 21 16 21"></polyline>
                    <line x1="15" y1="15" x2="21" y2="21"></line>
                    <line x1="4" y1="4" x2="9" y2="9"></line>
                  </svg>
                </button>

                <button class="btn-transport" id="btnPrev" onclick="skipPrev()" title="Previous Track">
                  <svg viewBox="0 0 24 24" fill="currentColor">
                    <polygon points="19 20 9 12 19 4 19 20"></polygon>
                    <rect x="5" y="4" width="2.5" height="16" rx="1"></rect>
                  </svg>
                </button>

                <!-- Signature Large Ruby Liquid Glass Play/Pause Capsule -->
                <button class="btn-play-capsule" id="btnPlayPause" onclick="togglePlayPause()" title="Play / Pause">
                  <div class="capsule-specular"></div>
                  <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor">
                    <polygon points="7 4 19 12 7 20 7 4"></polygon>
                  </svg>
                  <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                    <rect x="6" y="4" width="3.5" height="16" rx="1.5"></rect>
                    <rect x="14.5" y="4" width="3.5" height="16" rx="1.5"></rect>
                  </svg>
                </button>

                <button class="btn-transport" id="btnNext" onclick="skipNext()" title="Next Track">
                  <svg viewBox="0 0 24 24" fill="currentColor">
                    <polygon points="5 4 15 12 5 20 5 4"></polygon>
                    <rect x="16.5" y="4" width="2.5" height="16" rx="1"></rect>
                  </svg>
                </button>

                <button class="btn-transport" id="btnRepeat" onclick="toggleRepeat()" title="Repeat">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="17 1 21 5 17 9"></polyline>
                    <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                    <polyline points="7 23 3 19 7 15"></polyline>
                    <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
                  </svg>
                </button>
              </div>

              <!-- Volume Synchronization Bar with 3D Ruby Metallic Orb -->
              <div class="media-volume-strip">
                <button class="vol-icon-btn" id="btnMuteToggle" onclick="toggleMute()" title="Mute / Unmute">
                  <svg id="volIcon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                  </svg>
                  <svg id="muteIcon" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                    <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                  </svg>
                </button>

                <div class="vol-track-container" id="volumeTrack">
                  <div class="vol-track-fill" id="volumeFill">
                    <div class="vol-thumb-ball"></div>
                  </div>
                </div>

                <span class="vol-percentage" id="volumeBadge">75%</span>
              </div>

            </div>
          </div>
        </section>

        <!-- =========================================================================
             PAGE 2: MISSION CONTROL (8 Liquid Glass Blocks to Launch PC Applications)
             ========================================================================= -->
        <section class="carousel-page-pane page-mission" id="pageMission">
          <div class="mission-grid-8">
            
            <!-- Block 1: Browser -->
            <button class="liquid-pill-block" onclick="launchApp(1, 'Browser')">
              <div class="pill-left-content">
                <svg class="pill-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                  <circle cx="12" cy="12" r="10"></circle>
                  <line x1="2" y1="12" x2="22" y2="12"></line>
                  <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                </svg>
                <div class="pill-text-group">
                  <span class="pill-title">Browser</span>
                  <span class="pill-sub">Default Web</span>
                </div>
              </div>
              <span class="pill-badge">1</span>
            </button>

            <!-- Block 2: Spotify -->
            <button class="liquid-pill-block" onclick="launchApp(2, 'Spotify')">
              <div class="pill-left-content">
                <svg class="pill-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                  <circle cx="12" cy="12" r="10"></circle>
                  <path d="M8 11.5c3.5-1 7.5-.5 10.5 1"></path>
                  <path d="M7 14.5c3-.8 6.5-.4 9.5.8"></path>
                  <path d="M9 8.5c4-1.2 9-.8 12.5 1"></path>
                </svg>
                <div class="pill-text-group">
                  <span class="pill-title">Spotify</span>
                  <span class="pill-sub">Music Stream</span>
                </div>
              </div>
              <span class="pill-badge">2</span>
            </button>

            <!-- Block 3: File Explorer -->
            <button class="liquid-pill-block" onclick="launchApp(3, 'Explorer')">
              <div class="pill-left-content">
                <svg class="pill-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                  <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                </svg>
                <div class="pill-text-group">
                  <span class="pill-title">Explorer</span>
                  <span class="pill-sub">Files & Folders</span>
                </div>
              </div>
              <span class="pill-badge">3</span>
            </button>

            <!-- Block 4: Task Manager -->
            <button class="liquid-pill-block" onclick="launchApp(4, 'Task Manager')">
              <div class="pill-left-content">
                <svg class="pill-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                  <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                </svg>
                <div class="pill-text-group">
                  <span class="pill-title">Task Mgr</span>
                  <span class="pill-sub">Performance</span>
                </div>
              </div>
              <span class="pill-badge">4</span>
            </button>

            <!-- Block 5: Terminal -->
            <button class="liquid-pill-block" onclick="launchApp(5, 'Terminal')">
              <div class="pill-left-content">
                <svg class="pill-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                  <polyline points="4 17 10 11 4 5"></polyline>
                  <line x1="12" y1="19" x2="20" y2="19"></line>
                </svg>
                <div class="pill-text-group">
                  <span class="pill-title">Terminal</span>
                  <span class="pill-sub">PowerShell</span>
                </div>
              </div>
              <span class="pill-badge">5</span>
            </button>

            <!-- Block 6: Calculator -->
            <button class="liquid-pill-block" onclick="launchApp(6, 'Calculator')">
              <div class="pill-left-content">
                <svg class="pill-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                  <rect x="4" y="2" width="16" height="20" rx="2"></rect>
                  <line x1="8" y1="6" x2="16" y2="6"></line>
                  <line x1="16" y1="14" x2="16" y2="18"></line>
                  <line x1="8" y1="10" x2="8.01" y2="10"></line>
                  <line x1="12" y1="10" x2="12.01" y2="10"></line>
                  <line x1="16" y1="10" x2="16.01" y2="10"></line>
                  <line x1="8" y1="14" x2="8.01" y2="14"></line>
                  <line x1="12" y1="14" x2="12.01" y2="14"></line>
                </svg>
                <div class="pill-text-group">
                  <span class="pill-title">Calculator</span>
                  <span class="pill-sub">Math Utility</span>
                </div>
              </div>
              <span class="pill-badge">6</span>
            </button>

            <!-- Block 7: Notepad -->
            <button class="liquid-pill-block" onclick="launchApp(7, 'Notepad')">
              <div class="pill-left-content">
                <svg class="pill-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                  <polyline points="14 2 14 8 20 8"></polyline>
                  <line x1="16" y1="13" x2="8" y2="13"></line>
                </svg>
                <div class="pill-text-group">
                  <span class="pill-title">Notepad</span>
                  <span class="pill-sub">Text Editor</span>
                </div>
              </div>
              <span class="pill-badge">7</span>
            </button>

            <!-- Block 8: Windows Settings -->
            <button class="liquid-pill-block" onclick="launchApp(8, 'Settings')">
              <div class="pill-left-content">
                <svg class="pill-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                  <circle cx="12" cy="12" r="3"></circle>
                  <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
                <div class="pill-text-group">
                  <span class="pill-title">Settings</span>
                  <span class="pill-sub">PC Config</span>
                </div>
              </div>
              <span class="pill-badge">8</span>
            </button>

          </div>
        </section>

        <!-- =========================================================================
             PAGE 3: QUICK ACTIONS (4 Liquid Glass Blocks: Ctrl+C, Ctrl+V, Win+V, Screenshot)
             ========================================================================= -->
        <section class="carousel-page-pane page-actions" id="pageActions">
          <div class="actions-grid-4">
            
            <!-- Action 1: Ctrl + C (Copy) -->
            <button class="liquid-action-card" onclick="triggerPillAction('copy')">
              <div class="card-icon-halo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
              </div>
              <div class="card-text-block">
                <span class="card-main-title">Copy</span>
                <span class="card-shortcut-tag">Ctrl + C</span>
              </div>
              <div class="card-badge-disc">1</div>
            </button>

            <!-- Action 2: Ctrl + V (Paste) -->
            <button class="liquid-action-card" onclick="triggerPillAction('paste')">
              <div class="card-icon-halo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                  <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                </svg>
              </div>
              <div class="card-text-block">
                <span class="card-main-title">Paste</span>
                <span class="card-shortcut-tag">Ctrl + V</span>
              </div>
              <div class="card-badge-disc">2</div>
            </button>

            <!-- Action 3: Win + V (Clipboard History) -->
            <button class="liquid-action-card" onclick="triggerPillAction('history')">
              <div class="card-icon-halo">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path d="M0 3.449L9.75 2.1v9.451H0m10.949-9.602L24 0v11.551H10.949M0 12.6h9.75V22.05L0 20.7m10.949-8.1H24V24l-13.051-1.802"/>
                </svg>
              </div>
              <div class="card-text-block">
                <span class="card-main-title">Clipboard History</span>
                <span class="card-shortcut-tag">Win + V</span>
              </div>
              <div class="card-badge-disc">3</div>
            </button>

            <!-- Action 4: Win + Shift + S (Screenshot) -->
            <button class="liquid-action-card" onclick="triggerPillAction('screenshot')">
              <div class="card-icon-halo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                  <circle cx="12" cy="13" r="4"></circle>
                </svg>
              </div>
              <div class="card-text-block">
                <span class="card-main-title">Screenshot</span>
                <span class="card-shortcut-tag">Win + Shift + S</span>
              </div>
              <div class="card-badge-disc">4</div>
            </button>

          </div>
        </section>

      </div>
    </div>

    <!-- =========================================================================
         GAME CONTROLLER VIEWPORT (Cyberpunk Emerald Green Liquid Glass)
         ========================================================================= -->
    <div class="game-controller-viewport hidden" id="gameControllerViewport">
      <div class="cyber-controller-card" id="cyberControllerCard">
        <div class="controller-glass-specular"></div>

        <!-- ================= PANE 1: GYRO RACING COCKPIT ================= -->
        <div class="cockpit-pane cockpit-racing" id="cockpitGyroRacing">
          
          <!-- LEFT THUMB: BRAKE WING (ERGONOMIC RADIAL ARC) -->
          <div class="racing-wing-column racing-left-wing">
            <!-- Top Handbrake Capsule -->
            <button class="racing-capsule-btn btn-handbrake" id="btnHandbrake" data-gamepad="A" title="Handbrake (Space)">
              <div class="capsule-icon-ring">
                <span class="capsule-ring-core"></span>
              </div>
              <div class="capsule-text-group">
                <span class="capsule-label">HANDBRAKE</span>
                <span class="capsule-sub">SPACE</span>
              </div>
            </button>

            <!-- Main Brake Touch Zone & Inboard Paddle -->
            <div class="wing-pedal-composite">
              <button class="racing-pedal-btn pedal-brake" id="btnPedalBrake" data-gamepad="LT" title="Foot Brake / Reverse (S)">
                <!-- Upper Horizontal Rubber Traction Ribs -->
                <div class="pedal-ribs-horizontal">
                  <span></span><span></span><span></span><span></span><span></span>
                </div>
                
                <div class="pedal-center-meta">
                  <span class="pedal-code">LT</span>
                  <span class="pedal-title">BRAKE</span>
                  <span class="pedal-sub">REVERSE</span>
                </div>

                <!-- Lower Diagonal Emerald Traction Glow Stripes -->
                <div class="pedal-stripes-diagonal">
                  <span></span><span></span><span></span>
                </div>
              </button>

              <!-- Inboard Downshift Paddle -->
              <button class="racing-paddle-btn paddle-down" id="btnGearDown" data-gamepad="LB" title="Gear Down (Q)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
                <span>DOWN</span>
              </button>
            </div>
          </div>

          <!-- CENTER RACING HUD COCKPIT (TELEMETRY & GYRO HORIZON) -->
          <div class="racing-center-hud">
            <!-- Gyro Horizon Dial & Dynamic Speedometer Arc -->
            <div class="hud-gyro-gauge">
              <div class="gauge-center-arrow">▼</div>
              <svg class="gauge-dial-svg" viewBox="0 0 240 120">
                <!-- Outer Calibrated Scale Ticks -->
                <path class="gauge-dial-bg" d="M 30 110 A 90 90 0 0 1 210 110" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3" stroke-dasharray="3 6"/>
                <!-- Dynamic Steering Arc Fill -->
                <path class="gauge-dial-active" id="gyroDialArc" d="M 30 110 A 90 90 0 0 1 210 110" fill="none" stroke="#00ff88" stroke-width="4.5" stroke-dasharray="283" stroke-dashoffset="141"/>
                <!-- Center Needle Pivot & Indicator Line -->
                <g id="gyroGaugeNeedleGroup" style="transform-origin: 120px 110px;">
                  <line x1="120" y1="110" x2="120" y2="28" stroke="#00ff88" stroke-width="3" stroke-linecap="round"/>
                  <circle cx="120" cy="28" r="3.5" fill="#00ff88"/>
                </g>
              </svg>

              <!-- Prominent Center Degree Readout -->
              <div class="gauge-center-readout">
                <span class="hud-deg-number" id="gyroDegreeNum">0°</span>
                <span class="hud-deg-direction" id="gyroDirectionTag">CENTER LOCK</span>
              </div>

              <!-- Dynamic RPM Tachometer Bar below angle readout -->
              <div class="hud-rpm-box">
                <div class="rpm-track-arc">
                  <div class="rpm-fill-glow" id="rpmBarGlow"></div>
                </div>
                <span class="rpm-label-text">RPM</span>
              </div>
            </div>

            <!-- 1-Tap 0° Re-Center Glowing Capsule Button -->
            <button class="racing-recenter-capsule" id="btnGyroCalibrate" onclick="recalibrateGyro()" title="Re-Center Steering Angle to 0°">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/></svg>
              <span>0° RE-CENTER</span>
            </button>
          </div>

          <!-- RIGHT THUMB: THROTTLE (GAS) WING (ERGONOMIC RADIAL ARC) -->
          <div class="racing-wing-column racing-right-wing">
            <!-- Top Nitro Boost Capsule -->
            <button class="racing-capsule-btn btn-nitro" id="btnNitro" data-gamepad="X" title="Nitro Boost (Shift)">
              <div class="capsule-icon-bolt">
                <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
              </div>
              <div class="capsule-text-group">
                <span class="capsule-label">NITRO BOOST</span>
                <span class="capsule-sub">SHIFT</span>
              </div>
            </button>

            <!-- Main Gas Touch Zone & Inboard Paddle -->
            <div class="wing-pedal-composite right">
              <!-- Inboard Upshift Paddle -->
              <button class="racing-paddle-btn paddle-up" id="btnGearUp" data-gamepad="RB" title="Gear Up (E)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
                <span>UP</span>
              </button>

              <!-- Big Gas Pedal with Full Diagonal Emerald Power Stripes -->
              <button class="racing-pedal-btn pedal-gas" id="btnPedalGas" data-gamepad="RT" title="Throttle / Gas (W)">
                <div class="pedal-stripes-full-diagonal">
                  <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
                </div>
                <div class="pedal-center-meta">
                  <span class="pedal-code">RT</span>
                  <span class="pedal-title">GAS</span>
                  <span class="pedal-sub">THROTTLE</span>
                </div>
              </button>
            </div>
          </div>

        </div>

        <!-- ================= PANE 2: VIRTUAL GAMEPAD ================= -->
        <div class="cockpit-pane cockpit-gamepad hidden" id="cockpitGamepad">
          
          <!-- LEFT CLUSTER: Thumbstick & D-Pad -->
          <div class="gamepad-side-cluster gamepad-left">
            <div class="gamepad-triggers-row">
              <button class="cyber-bumper-btn" data-gamepad="LB">LB</button>
              <button class="cyber-trigger-btn" data-gamepad="LT">LT</button>
            </div>
            <div class="cyber-thumbstick-zone" id="thumbstickZone">
              <div class="thumbstick-base" id="thumbstickBase">
                <div class="thumbstick-crosshair"></div>
                <div class="thumbstick-knob" id="thumbstickKnob">
                  <div class="knob-core"></div>
                </div>
              </div>
            </div>
            <div class="cyber-dpad" id="cyberDpad">
              <button class="dpad-btn dpad-up" data-gamepad="DPAD_UP">▲</button>
              <button class="dpad-btn dpad-left" data-gamepad="DPAD_LEFT">◀</button>
              <div class="dpad-center"></div>
              <button class="dpad-btn dpad-right" data-gamepad="DPAD_RIGHT">▶</button>
              <button class="dpad-btn dpad-down" data-gamepad="DPAD_DOWN">▼</button>
            </div>
          </div>

          <!-- CENTER CLUSTER: Select & Start -->
          <div class="gamepad-center-meta">
            <button class="cyber-meta-btn" data-gamepad="SELECT">SELECT</button>
            <button class="cyber-meta-btn" data-gamepad="START">START</button>
          </div>

          <!-- RIGHT CLUSTER: ABXY Diamond -->
          <div class="gamepad-side-cluster gamepad-right">
            <div class="gamepad-triggers-row right">
              <button class="cyber-trigger-btn" data-gamepad="RT">RT</button>
              <button class="cyber-bumper-btn" data-gamepad="RB">RB</button>
            </div>
            <div class="cyber-abxy-diamond">
              <button class="abxy-btn btn-y" data-gamepad="Y"><span>Y</span></button>
              <div class="abxy-mid-row">
                <button class="abxy-btn btn-x" data-gamepad="X"><span>X</span></button>
                <div class="abxy-diamond-axis"></div>
                <button class="abxy-btn btn-b" data-gamepad="B"><span>B</span></button>
              </div>
              <button class="abxy-btn btn-a" data-gamepad="A"><span>A</span></button>
            </div>
          </div>

        </div>

      </div>
    </div>

  </div>

  <!-- ================= DESKTOP SELECTOR OVERLAY ================= -->
  <div class="desktop-launch-overlay hidden" id="desktopLaunchOverlay" onclick="closeDesktopSelector(event)">
    <div class="desktop-launch-card" onclick="event.stopPropagation()">
      <div class="launch-header">
        <div class="launch-title-wrap">
          <span class="launch-title">🖥️ Select Windows Host</span>
          <div class="radar-spinner"></div>
        </div>
        <button class="modal-close-btn" onclick="hideDesktopSelector()">✕</button>
      </div>

      <div class="desktop-devices-list" id="desktopDevicesList">
        <div class="desktop-item-card" style="justify-content: center; color: rgba(255,255,255,0.6); cursor: default;">
          <span>Searching local network...</span>
        </div>
      </div>

      <div class="launch-manual-row">
        <input type="text" class="launch-manual-input" id="manualIpInput" placeholder="Enter IP:58920 (e.g. 192.168.1.100:58920)">
        <button class="btn-manual-connect" onclick="connectManual()">Connect</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
