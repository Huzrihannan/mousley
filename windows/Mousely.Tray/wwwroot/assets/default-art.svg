<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0E7FF" />
      <stop offset="50%" stop-color="#FCE7F3" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
    <linearGradient id="discGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#4F46E5" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="48" fill="url(#bgGrad)" />

  <!-- Center Floating Disc / Note -->
  <g filter="url(#softShadow)">
    <circle cx="200" cy="200" r="105" fill="url(#discGrad)" />
    <!-- Vinyl grooves -->
    <circle cx="200" cy="200" r="85" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2" />
    <circle cx="200" cy="200" r="65" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2" />
    <circle cx="200" cy="200" r="45" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2" />
    <!-- Center spindle -->
    <circle cx="200" cy="200" r="28" fill="#FFFFFF" fill-opacity="0.9" />
    <circle cx="200" cy="200" r="10" fill="#4338CA" />
  </g>

  <!-- Music Notes / Waveform Sparkles -->
  <path d="M 140 100 Q 155 70 180 85" fill="none" stroke="#6366F1" stroke-width="4" stroke-linecap="round" opacity="0.6" />
  <path d="M 230 310 Q 255 330 280 305" fill="none" stroke="#EC4899" stroke-width="4" stroke-linecap="round" opacity="0.6" />

  <!-- Specular Glass Highlights -->
  <path d="M 40 40 Q 200 10 360 40 Q 200 120 40 40 Z" fill="url(#shineGrad)" opacity="0.5" />
</svg>
