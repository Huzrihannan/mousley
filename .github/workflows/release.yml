name: Build & Release (iOS IPA + Windows EXE)

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.4)'
        required: false
        default: 'v1.2.2'

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS IPA (iPhone 7 Plus / Unsigned)
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_16.0.app || true
          xcodebuild -version

      - name: Build with xcodebuild
        run: |
          xcodebuild -project ios/Mousely/Mousely.xcodeproj \
            -scheme Mousely \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            clean build

      - name: Package Mousely.ipa
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "Mousely.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Mousely.app not found!"
            exit 1
          fi
          echo "Packaging: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -y Mousely.ipa Payload
          echo "Successfully created Mousely.ipa!"

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-artifact
          path: Mousely.ipa
          retention-days: 14

  build-windows:
    name: Build Windows Executable & Package
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Windows App
        run: |
          dotnet publish windows/Mousely.Tray/Mousely.Tray.csproj -c Release -r win-x64 --self-contained false -o release-dist

      - name: Prepare Windows Assets
        shell: pwsh
        run: |
          Copy-Item "release-dist\Mousely.exe" "Mousely.exe"
          Compress-Archive -Path release-dist\* -DestinationPath Mousely-Windows-Tray-x64.zip

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries-artifact
          path: |
            Mousely.exe
            Mousely-Windows-Tray-x64.zip
          retention-days: 14

  publish-release:
    name: Publish to GitHub Releases
    needs: [ build-ios, build-windows ]
    runs-on: ubuntu-latest
    if: always() && (needs.build-ios.result == 'success' || needs.build-windows.result == 'success')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ios-ipa-artifact
          path: release-binaries

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: windows-binaries-artifact
          path: release-binaries

      - name: Compute Release Tag
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ github.event.inputs.tag_name }}" ]]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="v1.2.2"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Using tag: $TAG"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Mousely Release ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-binaries/*
          body: |
            ## 🎮 Mousely Dual-Cockpit Gaming Controller & Gyro Racing Release ${{ steps.vars.outputs.tag }}

            ### 📦 Direct Downloads:
            - 🍏 **[`Mousely.ipa`](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/Mousely.ipa)**: Native iOS app for **iPhone 7 Plus** and iOS 15.0+ devices with sub-millisecond UDP steering & input stream. Unsigned and ready for sideloading via TrollStore, AltStore, Sideloadly, or Scarlet.
            - 🖥️ **[`Mousely.exe`](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/Mousely.exe)**: Standalone Windows tray application with ViGEm virtual Xbox 360 controller emulation & zero-config keyboard fallback.
            - 📦 **[`Mousely-Windows-Tray-x64.zip`](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/Mousely-Windows-Tray-x64.zip)**: Complete Windows distribution package.

            ---

            ### 🌟 What's New in v1.2.2:
            - **🏎️ Ergonomic Racing Cockpit Redesign**: Prominent vertical Brake (LT) and Gas (RT) pedals with rubber traction texture for natural left/right thumb placement, dedicated Handbrake (Space), Nitro (Shift), and Gear Down/Up paddle buttons.
            - **🎯 Fast GPU Digital Horizon HUD**: Live center steering angle meter with 1-tap `0° Re-Center` button, digital degree readout, and GPU-accelerated horizontal indicator bar (`translate3d`).
            - **❄️ Zero Thermal Throttling & 90% Reduced IPC Overhead**: CoreMotion background queue processing throttled to 20Hz, event-driven instant touch dispatch, and calm 13Hz keepalive heartbeat. Eliminates all phone heating and touch input lag.
            - **✨ Perfect Mode Switching**: Fixed track collapse when toggling between Remote Deck and Gaming Controller. Trackpad and Media Deck layouts remain 100% stable with zero visual glitches.
            - **🕹️ DirectX Hardware Scan Codes**: Set 1 keyboard scan codes (`SC_W`, `SC_S`, `SC_A`, `SC_D`, `SC_SPACE`, `SC_LSHIFT`) with 250ms safety watchdog for seamless PC gaming compatibility.
