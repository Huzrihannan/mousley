name: Build & Release (iOS IPA + Windows EXE)

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.4)'
        required: false
        default: 'v1.2.1'

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS IPA (iPhone 7 Plus / Unsigned)
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_16.0.app || true
          xcodebuild -version

      - name: Build with xcodebuild
        run: |
          xcodebuild -project ios/Mousely/Mousely.xcodeproj \
            -scheme Mousely \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            clean build

      - name: Package Mousely.ipa
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "Mousely.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Mousely.app not found!"
            exit 1
          fi
          echo "Packaging: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -y Mousely.ipa Payload
          echo "Successfully created Mousely.ipa!"

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-artifact
          path: Mousely.ipa
          retention-days: 14

  build-windows:
    name: Build Windows Executable & Package
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Windows App
        run: |
          dotnet publish windows/Mousely.Tray/Mousely.Tray.csproj -c Release -r win-x64 --self-contained false -o release-dist

      - name: Prepare Windows Assets
        shell: pwsh
        run: |
          Copy-Item "release-dist\Mousely.exe" "Mousely.exe"
          Compress-Archive -Path release-dist\* -DestinationPath Mousely-Windows-Tray-x64.zip

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries-artifact
          path: |
            Mousely.exe
            Mousely-Windows-Tray-x64.zip
          retention-days: 14

  publish-release:
    name: Publish to GitHub Releases
    needs: [ build-ios, build-windows ]
    runs-on: ubuntu-latest
    if: always() && (needs.build-ios.result == 'success' || needs.build-windows.result == 'success')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ios-ipa-artifact
          path: release-binaries

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: windows-binaries-artifact
          path: release-binaries

      - name: Compute Release Tag
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ github.event.inputs.tag_name }}" ]]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="v1.2.1"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Using tag: $TAG"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Mousely Release ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-binaries/*
          body: |
            ## 🎮 Mousely Cyberpunk Gaming Controller & Gyro Steering Release ${{ steps.vars.outputs.tag }}

            ### 📦 Direct Downloads:
            - 🍏 **[`Mousely.ipa`](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/Mousely.ipa)**: Native iOS app for **iPhone 7 Plus** and iOS 15.0+ devices with sub-millisecond UDP steering & input stream. Unsigned and ready for sideloading via TrollStore, AltStore, Sideloadly, or Scarlet.
            - 🖥️ **[`Mousely.exe`](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/Mousely.exe)**: Standalone Windows tray application with ViGEm virtual Xbox 360 controller emulation & zero-config keyboard fallback.
            - 📦 **[`Mousely-Windows-Tray-x64.zip`](https://github.com/${{ github.repository }}/releases/download/${{ steps.vars.outputs.tag }}/Mousely-Windows-Tray-x64.zip)**: Complete Windows distribution package.

            ---

            ### 🌟 What's New in v1.2.0:
            - **🎮 Dedicated Mode Switcher Pill**: Switch instantly between Remote Deck (Product Red) and Gaming Controller (Cyberpunk Emerald Green `#00ff88`).
            - **🏎️ Gyro Steering Engine**: Turn your phone into an ultra-responsive steering wheel using hardware gyroscope roll tilt in landscape orientation. Features a live SVG needle arch gauge, digital degree display, and 1-tap instant zero-recalibration.
            - **🕹️ Adaptive Hybrid Controller**: Includes a multi-touch analog thumbstick, tactile 4-way D-pad, 3D glowing ABXY action diamond, LT/RT triggers (Brake/Gas), and LB/RB bumpers.
            - **⚡ 9-Byte Binary Datagram Protocol (`0x10`)**: Streamlined UDP binary transport over port 58922 with Wi-Fi WMM QoS (`.responsiveData`) on iOS and high-performance WebSocket fallback.
            - **🎮 Host Xbox 360 Emulation + Keyboard Fallback**: Supports ViGEmBus for native Xbox 360 controller detection across Steam, Forza, GTA, and EA Sports, with automatic WASD keyboard fallback if driver is not present.
