name: Build iOS IPA (iPhone 7 Plus / Unsigned)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Compile Mousely IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_16.0.app || true
          xcodebuild -version

      - name: Build Mousely with xcodebuild (Unsigned for Sideloading)
        run: |
          xcodebuild -project ios/Mousely/Mousely.xcodeproj \
            -scheme Mousely \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            clean build

      - name: Create Payload and Package IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "Mousely.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Mousely.app not found!"
            exit 1
          fi
          echo "Found app bundle at: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -y Mousely-unsigned.ipa Payload
          echo "Created Mousely-unsigned.ipa successfully!"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mousely-iPhone-Unsigned-IPA
          path: Mousely-unsigned.ipa
          retention-days: 14

      - name: Create Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Mousely-unsigned.ipa
          draft: false
          prerelease: false
          name: Release ${{ github.ref_name }}
          body: |
            ### Mousely iOS IPA (Unsigned)
            - **Target**: iPhone 7 Plus & modern iPhones (iOS 15.0+)
            - **Sideloading**: Compatible with TrollStore, AltStore, Sideloadly, Scarlet
            - Built automatically with GitHub Actions
