name: Build Windows Systray App

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Mousely Windows Tray
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Mousely.Tray
        run: |
          dotnet publish windows/Mousely.Tray/Mousely.Tray.csproj -c Release -r win-x64 --self-contained false -o release-dist

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path release-dist\* -DestinationPath Mousely-Windows-Tray-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mousely-Windows-Tray-x64
          path: Mousely-Windows-Tray-x64.zip
          retention-days: 14

      - name: Add to Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Mousely-Windows-Tray-x64.zip
