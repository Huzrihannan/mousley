<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mousely - Windows Remote</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- ================= DYNAMIC LIQUID AMBIENT BACKGROUND ================= -->
  <div class="dynamic-background-container" aria-hidden="true">
    <div class="liquid-mesh-base"></div>
    <div class="liquid-wave wave-1"></div>
    <div class="liquid-wave wave-2"></div>
    <div class="liquid-wave wave-3"></div>
    <div class="liquid-caustic-layer"></div>
    <div class="liquid-vignette"></div>
  </div>

  <!-- Dynamic Island Notification Toast -->
  <div class="apple-island-toast" id="appleToast">
    <div class="island-icon" id="toastIcon">✨</div>
    <span class="island-text" id="toastText">Connected</span>
  </div>

  <div class="app-landscape-root">
    <!-- Top Navigation Header -->
    <header class="top-header">
      <div class="brand-group">
        <img src="assets/logo.png" alt="Mousely" class="brand-logo" onerror="this.src='assets/default-art.svg'">
        <span class="brand-name">Mousely</span>
      </div>

      <!-- Segmented Liquid Glass Navigation Tabs -->
      <nav class="nav-segmented-glass" id="navTabs">
        <button class="nav-tab active" data-page="0" onclick="switchPage(0)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
          <span>Media</span>
        </button>
        <button class="nav-tab" data-page="1" onclick="switchPage(1)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          <span>Apps (8)</span>
        </button>
        <button class="nav-tab" data-page="2" onclick="switchPage(2)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
          <span>Clipboard</span>
        </button>
      </nav>

      <!-- Connection Status & Desktop Selector Button -->
      <div class="header-right-group">
        <div class="status-badge" id="statusBadge" onclick="showDesktopSelector()">
          <span class="status-dot" id="statusDot"></span>
          <span class="device-name" id="statusDeviceName">Select Desktop</span>
          <span class="latency-tag" id="latencyTag">-- ms</span>
        </div>
        <button class="header-action-btn" id="btnSettings" onclick="showDesktopSelector()" title="Switch Desktop">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Viewport Carousel (3 Pages) -->
    <div class="carousel-container" id="carouselContainer">
      <div class="carousel-track" id="carouselTrack">
        
        <!-- ================= PAGE 1: MEDIA CONTROL ================= -->
        <section class="page-pane page-media" id="pageMedia">
          <div class="media-layout-grid">
            
            <!-- Left Column: Artwork & Info -->
            <div class="media-card-left">
              <div class="artwork-frame" id="artworkContainer">
                <img class="artwork-img" id="albumArtImg" src="assets/default-art.svg" alt="Album Artwork" onerror="this.src='assets/default-art.svg'">
                <div class="source-badge" id="sourceAppPill">Windows Media</div>
              </div>
              <div class="track-meta">
                <div class="track-title" id="trackTitle">Ready to Connect</div>
                <div class="track-artist" id="trackArtist">Waiting for Windows Playback</div>
              </div>
            </div>

            <!-- Right Column: Scrubber, Controls, Volume -->
            <div class="media-card-right">
              <!-- Timeline Scrubber -->
              <div class="timeline-row">
                <span class="time-text" id="timeElapsed">0:00</span>
                <div class="timeline-bar-wrap" id="timelineBar">
                  <div class="timeline-progress" id="timelineProgress">
                    <div class="timeline-thumb"></div>
                  </div>
                </div>
                <span class="time-text" id="timeTotal">0:00</span>
              </div>

              <!-- Playback Controls Cluster -->
              <div class="controls-cluster">
                <button class="btn-ctrl btn-skip" id="btnPrev" title="Previous Track">
                  <svg viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"></line></svg>
                </button>

                <button class="btn-ctrl btn-play" id="btnPlayPause" title="Play / Pause">
                  <svg id="playIcon" viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>
                  <svg id="pauseIcon" viewBox="0 0 24 24" style="display: none;"><rect x="6" y="4" width="4" height="16" rx="1.5"></rect><rect x="14" y="4" width="4" height="16" rx="1.5"></rect></svg>
                </button>

                <button class="btn-ctrl btn-skip" id="btnNext" title="Next Track">
                  <svg viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"></line></svg>
                </button>
              </div>

              <!-- Volume Synchronization Bar & Presets -->
              <div class="volume-container">
                <div class="volume-bar-row">
                  <button class="volume-icon-btn" id="btnMuteToggle" title="Mute / Unmute">
                    <svg id="volIcon" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07" stroke="currentColor" stroke-width="2" fill="none"></path></svg>
                    <svg id="muteIcon" viewBox="0 0 24 24" style="display: none;"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line><line x1="17" y1="9" x2="23" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line></svg>
                  </button>

                  <div class="volume-track-wrap" id="volumeTrack">
                    <div class="volume-fill" id="volumeFill">
                      <div class="volume-thumb"></div>
                    </div>
                  </div>

                  <span class="volume-badge" id="volumeBadge">50%</span>
                </div>

                <div class="preset-pills-row">
                  <button class="preset-pill" onclick="setVolumePreset(25)">25%</button>
                  <button class="preset-pill" onclick="setVolumePreset(50)">50%</button>
                  <button class="preset-pill" onclick="setVolumePreset(75)">75%</button>
                  <button class="preset-pill" onclick="setVolumePreset(100)">100%</button>
                  <button class="preset-pill" onclick="toggleMute()">Mute</button>
                </div>
              </div>
            </div>

          </div>
        </section>

        <!-- ================= PAGE 2: MISSION CONTROL (8 BLOCKS) ================= -->
        <section class="page-pane page-mission" id="pageMission">
          <div class="mission-header">
            <h2 class="section-title">Mission Control</h2>
          </div>

          <div class="blocks-grid-8">
            <!-- Block 1: Browser -->
            <button class="glass-app-block" onclick="launchApp(1, 'Browser')">
              <div class="block-icon-wrap icon-blue">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
              </div>
              <div class="block-text">
                <span class="block-name">Browser</span>
              </div>
            </button>

            <!-- Block 2: Spotify -->
            <button class="glass-app-block" onclick="launchApp(2, 'Spotify')">
              <div class="block-icon-wrap icon-green">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M8 11.5c3.5-1 7.5-.5 10.5 1"></path><path d="M7 14.5c3-.8 6.5-.4 9.5.8"></path><path d="M9 8.5c4-1.2 9-.8 12.5 1"></path></svg>
              </div>
              <div class="block-text">
                <span class="block-name">Spotify</span>
              </div>
            </button>

            <!-- Block 3: File Explorer -->
            <button class="glass-app-block" onclick="launchApp(3, 'Explorer')">
              <div class="block-icon-wrap icon-amber">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
              </div>
              <div class="block-text">
                <span class="block-name">Explorer</span>
              </div>
            </button>

            <!-- Block 4: Task Manager -->
            <button class="glass-app-block" onclick="launchApp(4, 'Task Manager')">
              <div class="block-icon-wrap icon-purple">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
              </div>
              <div class="block-text">
                <span class="block-name">Task Manager</span>
              </div>
            </button>

            <!-- Block 5: Terminal -->
            <button class="glass-app-block" onclick="launchApp(5, 'Terminal')">
              <div class="block-icon-wrap icon-slate">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
              </div>
              <div class="block-text">
                <span class="block-name">Terminal</span>
              </div>
            </button>

            <!-- Block 6: Calculator -->
            <button class="glass-app-block" onclick="launchApp(6, 'Calculator')">
              <div class="block-icon-wrap icon-rose">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"></rect><line x1="8" y1="6" x2="16" y2="6"></line><line x1="16" y1="14" x2="16" y2="18"></line><line x1="8" y1="10" x2="8.01" y2="10"></line><line x1="12" y1="10" x2="12.01" y2="10"></line><line x1="16" y1="10" x2="16.01" y2="10"></line><line x1="8" y1="14" x2="8.01" y2="14"></line><line x1="12" y1="14" x2="12.01" y2="14"></line><line x1="8" y1="18" x2="8.01" y2="18"></line><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>
              </div>
              <div class="block-text">
                <span class="block-name">Calculator</span>
              </div>
            </button>

            <!-- Block 7: Notepad -->
            <button class="glass-app-block" onclick="launchApp(7, 'Notepad')">
              <div class="block-icon-wrap icon-indigo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
              </div>
              <div class="block-text">
                <span class="block-name">Notepad</span>
              </div>
            </button>

            <!-- Block 8: Windows Settings -->
            <button class="glass-app-block" onclick="launchApp(8, 'Settings')">
              <div class="block-icon-wrap icon-cyan">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
              </div>
              <div class="block-text">
                <span class="block-name">Settings</span>
              </div>
            </button>
          </div>
        </section>

        <!-- ================= PAGE 3: CLIPBOARD ACTIONS (3 BLOCKS) ================= -->
        <section class="page-pane page-clipboard" id="pageClipboard">
          <div class="clipboard-header">
            <h2 class="section-title">Quick Actions</h2>
          </div>

          <div class="blocks-grid-4">
            <!-- Block 1: Ctrl + C -->
            <button class="glass-clip-block clip-copy" onclick="triggerClipboardAction('copy')">
              <div class="clip-keycap">
                <span class="key-badge">Ctrl</span>
                <span class="key-plus">+</span>
                <span class="key-badge">C</span>
              </div>
              <div class="clip-label-group">
                <span class="clip-title">Copy</span>
              </div>
            </button>

            <!-- Block 2: Ctrl + V -->
            <button class="glass-clip-block clip-paste" onclick="triggerClipboardAction('paste')">
              <div class="clip-keycap">
                <span class="key-badge">Ctrl</span>
                <span class="key-plus">+</span>
                <span class="key-badge">V</span>
              </div>
              <div class="clip-label-group">
                <span class="clip-title">Paste</span>
              </div>
            </button>

            <!-- Block 3: Win + V -->
            <button class="glass-clip-block clip-history" onclick="triggerClipboardAction('history')">
              <div class="clip-keycap">
                <span class="key-badge"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M0 3.449L9.75 2.1v9.451H0m10.949-9.602L24 0v11.551H10.949M0 12.6h9.75V22.05L0 20.7m10.949-8.1H24V24l-13.051-1.802"/></svg> Win</span>
                <span class="key-plus">+</span>
                <span class="key-badge">V</span>
              </div>
              <div class="clip-label-group">
                <span class="clip-title">Clipboard History</span>
              </div>
            </button>

            <!-- Block 4: Win + Shift + S (Screenshot) -->
            <button class="glass-clip-block clip-screenshot" onclick="triggerClipboardAction('screenshot')">
              <div class="clip-keycap">
                <span class="key-badge"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M0 3.449L9.75 2.1v9.451H0m10.949-9.602L24 0v11.551H10.949M0 12.6h9.75V22.05L0 20.7m10.949-8.1H24V24l-13.051-1.802"/></svg> Win</span>
                <span class="key-plus">+</span>
                <span class="key-badge">⇧ Shift</span>
                <span class="key-plus">+</span>
                <span class="key-badge">S</span>
              </div>
              <div class="clip-label-group">
                <span class="clip-title">Screenshot</span>
              </div>
            </button>
          </div>
        </section>

      </div>
    </div>

    <!-- Minimalist Carousel Dots Footer -->
    <footer class="bottom-bar">
      <div class="carousel-dots" id="carouselDots">
        <span class="dot active" onclick="switchPage(0)"></span>
        <span class="dot" onclick="switchPage(1)"></span>
        <span class="dot" onclick="switchPage(2)"></span>
      </div>
    </footer>
  </div>

  <!-- ================= LAUNCH DESKTOP SELECTOR OVERLAY ================= -->
  <div class="desktop-launch-overlay" id="desktopLaunchOverlay">
    <div class="desktop-launch-card">
      <div class="launch-header">
        <div class="launch-title-wrap">
          <div class="launch-title">
            <span>🖥️ Select Desktop</span>
            <div class="radar-spinner"></div>
          </div>
        </div>
        <button class="header-action-btn" onclick="hideDesktopSelector()" title="Dismiss">✕</button>
      </div>

      <!-- Discovered Desktops List -->
      <div class="desktop-devices-list" id="desktopDevicesList">
        <div class="desktop-item-card" style="justify-content: center; color: var(--text-secondary); cursor: default;">
          <span>Searching local network...</span>
        </div>
      </div>

      <!-- Manual IP Entry Fallback -->
      <div class="launch-manual-row">
        <input type="text" class="launch-manual-input" id="manualIpInput" placeholder="Enter IP (e.g. 192.168.1.100:58920)">
        <button class="btn-manual-connect" onclick="connectManual()">Connect</button>
      </div>
    </div>
  </div>

  <!-- Ultra-Fast Zero-Lag App Logic -->
  <script src="app.js"></script>
</body>
</html>
